<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>安全工具箱 - 网安罗盘</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="tools">
    <header class="topbar">
      <a class="brand" href="/" aria-label="网安罗盘首页">
        <img class="brand-logo" src="/assets/logo-custom.png" alt="网安罗盘 Logo">
        <div class="brand-copy">
          <h1>网安罗盘</h1>
          <p>Cyber Compass</p>
        </div>
      </a>

      <nav class="nav-links" aria-label="栏目导航">
        <a href="/" data-nav="home">首页</a>
        <a href="/news" data-nav="news">资讯</a>
        <a href="/events" data-nav="events">赛事</a>
        <a href="/resources" data-nav="resources">资源</a>
        <a href="/roadmap" data-nav="roadmap">学习路线</a>
        <a href="/tools" data-nav="tools">安全工具箱</a>
      </nav>

      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
        <span class="theme-icon" aria-hidden="true">☾</span>
        <span class="theme-label">深色</span>
      </button>
    </header>

    <main>
      <section class="page-hero">
        <div class="hero-copy">
          <p class="eyebrow">Toolbox</p>
          <h2>安全工具箱</h2>
          <p>CTF 常用工具合集，涵盖 Web、MISC、密码学、逆向、PWN、AWD 等方向。</p>
        </div>
        <div class="hero-panel">
          <dl class="metric-grid">
            <div>
              <dt>Total</dt>
              <dd><span id="toolCount">0</span> 个工具</dd>
            </div>
            <div>
              <dt>Visible</dt>
              <dd><span id="visibleCount">0</span> 个显示</dd>
            </div>
            <div>
              <dt>Source</dt>
              <dd><a class="tools-reference" href="https://hello-ctf.com/sidebar/tools.html" target="_blank" rel="noopener noreferrer">Hello CTF</a></dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="content-band">
        <div class="tools-controls">
          <div class="tools-meta">
            <span>共 <strong id="toolCountInline">0</strong> 个工具</span>
            <span>显示 <strong id="visibleCountInline">0</strong> 个</span>
          </div>
          <div class="search-box">
            <label class="tool-search">
              <span class="eyebrow">Search</span>
              <input id="toolSearchInput" type="search" placeholder="搜索工具名称、描述或标签">
            </label>
            <button class="clear-button" id="clearToolSearch" type="button">清空搜索</button>
          </div>
          <div class="tag-bar" id="tagBar" aria-label="工具标签筛选">
            <button class="tag-filter is-active" type="button" data-tag="all">全部</button>
          </div>
        </div>

        <div class="tool-grid" id="toolGrid"></div>
        <div class="empty" id="toolEmpty">没有找到匹配的工具。</div>
      </section>
    </main>

    <script src="/site.js" defer></script>
    <script src="/tools.js" defer></script>
  </body>
</html>
